name: Go

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  java-version:
    runs-on: ubuntu-latest
    steps:
    - run: "java --version"

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.23'

    - name: Build
      run: go build -v ./...

  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read       # Read repo content
      pull-requests: read  # Read PR base commit
      checks: write        # Annotate code

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1
          # Only report new issues introduced by *this* PR. Requires
          # `permissons.pull-requests: read`.
          only-new-issues: true

  test:
    runs-on: ubuntu-latest
    steps:
    - run: 'sudo apt-get install openjdk-21-jdk'


    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.23'

    - uses: google-github-actions/setup-gcloud@v3
      with:
        version: '>= 486.0.0'
        install_components: 'cloud-firestore-emulator'

    - name: Start Firestore emulator
      run: |
        gcloud emulators firestore start --host-port=[::1]:8410 &

        until curl '[::1]:8410' 2>/dev/null; do
            sleep 1
        done

    - name: Test
      run: go test -v ./...
      env:
        FIRESTORE_EMULATOR_HOST: '[::1]:8410'

